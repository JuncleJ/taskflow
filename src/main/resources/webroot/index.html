<!doctype html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>TaskFlow</title>
    <link rel="stylesheet" href="/style.css">
    <script src="/app.js" defer></script>
</head>
<body>
<main>
    <header>
        <div><p class="eyebrow">ФОНОВЫЕ ЗАДАЧИ</p>
            <h1>TaskFlow</h1></div>
        <div id="account" class="actions" hidden>
            <span class="account-name">Вы вошли как <strong id="current-user"></strong></span>
            <button id="logout">Выйти</button>
        </div>
    </header>
    <p id="message" role="status" aria-live="polite"></p>
    <section id="auth">
        <h2>Вход в рабочее пространство</h2>
        <form id="auth-form">
            <label>Логин<input id="login" autocomplete="username" required minlength="3" maxlength="64"
                               pattern="[A-Za-z0-9_]+"></label>
            <label>Пароль<input id="password" type="password" autocomplete="current-password" required minlength="8"
                                maxlength="128"></label>
            <div class="actions">
                <button type="submit">Войти</button>
                <button type="button" id="register">Зарегистрироваться</button>
            </div>
        </form>
        <p class="hint">Логин: латинские буквы, цифры и _. Пароль: от 8 символов.</p>
    </section>
    <section id="workspace" hidden>
        <div class="toolbar">
            <div><h2>Мои задачи</h2>
                <p>Запустите задачу и следите за выполнением в реальном времени.</p></div>
            <div class="actions task-launcher">
                <div>
                    <label>DEMO: длительность, с
                        <input id="duration-seconds" type="number" min="1" max="300" step="1" value="5" required>
                    </label>
                    <button data-type="DEMO">Запустить DEMO</button>
                </div>
                <div>
                    <label>CPU_TASK: верхняя граница
                        <input id="cpu-limit" type="number" min="2" max="10000000" step="1" value="1000000" required>
                    </label>
                    <button data-type="CPU_TASK">Запустить CPU_TASK</button>
                </div>
                <button id="refresh">Обновить</button>
            </div>
        </div>
        <p id="empty">У вас пока нет задач.</p>
        <div id="tasks"></div>
    </section>
</main>
</body>
</html>
