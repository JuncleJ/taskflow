services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: ${DB_NAME:-taskflow}
      POSTGRES_USER: ${DB_USER:-taskflow}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB" ]
      interval: 3s
      timeout: 3s
      retries: 20
  app:
    build: .
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-taskflow}
      DB_USER: ${DB_USER:-taskflow}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      TASK_PARALLELISM: ${TASK_PARALLELISM:-3}
      TASK_QUEUE_CAPACITY: ${TASK_QUEUE_CAPACITY:-100}
      CPU_WORKERS: ${CPU_WORKERS:-2}
      CPU_QUEUE_CAPACITY: ${CPU_QUEUE_CAPACITY:-16}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "${HTTP_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy
volumes:
  postgres-data:
